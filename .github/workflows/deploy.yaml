name: Deploy to GitHub Pages

permissions:
  contents: write
  pages: write

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PIP_CONSTRAINT: /tmp/constraints.txt

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Constrain setuptools and install dependencies
        run: |
          echo "setuptools<81" > /tmp/constraints.txt
          python -m pip install --upgrade pip "setuptools<81" wheel
          pip install -q "nbdev>=3.3.10"
          # If pyCRLD still fails in build isolation, install it first with --no-build-isolation:
          # pip install -q --no-build-isolation "pyCRLD @ git+https://github.com/OWNER/pyCRLD.git"
          pip install -q -e '.[dev]' --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Export and build documentation
        run: |
          nbdev-export
          nbdev-docs

      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _docs
          publish_branch: gh-pages