name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies without build isolation
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel
          pip install -q "nbdev>=3.3.10"
          # If pyCRLD is installed explicitly here rather than from pyproject.toml, install it first:
          # pip install -q --no-build-isolation "pyCRLD @ git+https://github.com/OWNER/pyCRLD.git"
          pip install -q --no-build-isolation -e '.[dev]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Export and verify clean git status
        run: |
          nbdev-export
          git status --porcelain

      - name: Run nbdev tests
        run: |
          nbdev-test