project:
  type: book
  output-dir: __output

bibliography: DDRL.bib
csl: apa7.csl

book:
  title: Supplementary Information for Distributional Deterministic Reinforcement Learning
  author: Clemence Bergerot et al.
  date: last-modified
  date-format: long
  downloads: [pdf]
  # repo-url: https://github.com/wbarfuss/collective-cooperative-intelligence
  sidebar:
    style: floating
  chapters:
    - index.ipynb
    - 02.01_DDRLBase.ipynb
    - 02.02_DDRLSarsa.ipynb
    - 02.03_BiasingMethods.ipynb
    - 03_Environments.ipynb
    - 04_Results.ipynb
    - 05_Proofs.ipynb
    - 06_References.ipynb

format:
  html:
    theme:
      light: Flatly
      dark: Darkly
    toc: true
    number-depth: 1

  pdf:
    documentclass: scrreprt
    papersize: A4
    geometry: 
      - top=20mm
      - left=20mm
      - right=20mm
      - bottom=25mm
    fig-width: 9
    fig-height: 7
    # mathspec: true
    include-in-header: 
      text: |
        \usepackage{mathtools,amsfonts,dsfont,amsmath,amssymb}
        \usepackage{lscape}
        \newcommand{\blandscape}{\begin{landscape}{\tiny}
        \newcommand{\elandscape}{\end{landscape}}}
        %
        % break long lines of code
        \usepackage{fvextra} 
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}  
        \DefineVerbatimEnvironment{OutputCode}{Verbatim}{breaklines,commandchars=\\\{\}}
    block-headings: false
    link-citations: true
    number-depth: 2
    toc-depth: 2
	
